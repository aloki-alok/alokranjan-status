name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment:
    name: Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPTIME_STATUS_PLATFORM: ${{ github.workspace }}/platform
    steps:
      - name: Check out site
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: site

      - name: Check out platform
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: aloki-alok/uptime-status
          ref: 242e4826e7681d36fe7a2eaadc01a2f3c169b907
          path: platform

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install platform dependencies
        run: bun install --frozen-lockfile
        working-directory: platform

      - name: Install site dependencies
        run: bun install --frozen-lockfile
        working-directory: site

      - name: Build and verify deployment
        run: bun run build && bun run check
        working-directory: site
